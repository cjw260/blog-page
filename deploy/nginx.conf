worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /dev/stdout;
  sendfile on;
  server_tokens off;
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  resolver 127.0.0.11 valid=10s ipv6=off;
  limit_req_zone $binary_remote_addr zone=stats_limit:1m rate=20r/s;
  map $arg_v $profile_cache_control {
    default "no-cache";
    "~^[0-9a-f]{16}$" "public, max-age=31536000, immutable";
  }
  server {
    listen 8080;
    root /usr/share/nginx/html;
    location = /healthz { access_log off; default_type application/json; return 200 '{"status":"ok"}'; }
    location = /blog/api/stats/total {
      access_log off;
      client_max_body_size 2k;
      limit_req zone=stats_limit burst=40 nodelay;
      limit_req_status 429;
      set $stats_backend http://stats:8080;
      proxy_pass $stats_backend/total;
      proxy_connect_timeout 2s;
      proxy_read_timeout 8s;
      proxy_set_header Connection "";
      proxy_http_version 1.1;
    }
    location = /blog/api/stats/visit {
      access_log off;
      client_max_body_size 2k;
      limit_req zone=stats_limit burst=40 nodelay;
      limit_req_status 429;
      set $stats_backend http://stats:8080;
      proxy_pass $stats_backend/visit;
      proxy_connect_timeout 2s;
      proxy_read_timeout 8s;
      proxy_set_header Connection "";
      proxy_http_version 1.1;
    }
    location = /blog/profile.jpeg {
      try_files $uri =404;
      add_header Cache-Control $profile_cache_control;
    }
    location = /blog { return 308 /blog/; }
    location /blog/_astro/ { try_files $uri =404; expires 1y; add_header Cache-Control "public, immutable"; }
    location /blog/markdown/ { try_files $uri =404; add_header Cache-Control "no-cache"; }
    location /blog/ { try_files $uri $uri/index.html =404; add_header Cache-Control "no-cache"; }
    error_page 404 /blog/404.html;
    location = /blog/404.html { internal; }
    location / { return 404; }
    location ~ /\. { deny all; }
  }
}
